[package]
name = "osm-road-prep"
version = "0.1.0"
edition = "2024"
description = "Disk-backed OSM PBF preprocessing into tiled directed road columns"
exclude = ["dist/**", "target/**", ".venv/**", "**/__pycache__/**", "**/*.pyc"]

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
lru = "0.16"
memmap2 = "0.9"
osmpbf = "0.3.8"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
rayon = "1.11"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

